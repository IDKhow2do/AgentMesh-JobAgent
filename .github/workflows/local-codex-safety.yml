name: Local Codex Safety Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/jobagent/local_*.py'
      - 'src/jobagent/official*.py'
      - 'tests/test_local_*.py'
      - 'tests/test_official.py'
      - 'pyproject.toml'
      - '.github/workflows/local-codex-safety.yml'
  pull_request:
    paths:
      - 'src/jobagent/local_*.py'
      - 'src/jobagent/official*.py'
      - 'tests/test_local_*.py'
      - 'tests/test_official.py'
      - 'pyproject.toml'
      - '.github/workflows/local-codex-safety.yml'

permissions:
  contents: read

jobs:
  deterministic-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test environment
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile local modules
        run: |
          python -m compileall -q src/jobagent/local_cli.py src/jobagent/local_state.py src/jobagent/official.py src/jobagent/official_cli.py
      - name: Run deterministic local tests
        run: |
          pytest -q tests/test_local_cli.py tests/test_local_state.py tests/test_official.py

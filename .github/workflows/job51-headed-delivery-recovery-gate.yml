name: 51Job headed delivery-recovery gate

on:
  pull_request:
    paths:
      - ".github/workflows/job51-headed-delivery-recovery-gate.yml"
      - "scripts/ci/job51_headed_delivery_recovery_gate.py"
      - "src/jobagent/platforms/job51/**"
      - "src/jobagent/application/delivery.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job51-headed-delivery-recovery-gate
  cancel-in-progress: true

jobs:
  read-only-recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install candidate
        run: python -m pip install -e .

      - name: Run isolated headed Chrome under Xvfb
        env:
          DISPLAY: ":99"
          JOB51_GATE_REPORT: "${{ runner.temp }}/job51-headed-delivery-recovery.json"
        run: |
          set -euo pipefail
          command -v Xvfb
          command -v google-chrome

          profile="$(mktemp -d "${RUNNER_TEMP}/job51-headed-profile.XXXXXX")"
          cleanup() {
            set +e
            if [[ -n "${chrome_pid:-}" ]]; then
              kill "${chrome_pid}" 2>/dev/null
              wait "${chrome_pid}" 2>/dev/null
            fi
            if [[ -n "${xvfb_pid:-}" ]]; then
              kill "${xvfb_pid}" 2>/dev/null
              wait "${xvfb_pid}" 2>/dev/null
            fi
            rm -rf "${profile}" 2>/dev/null || true
            return 0
          }
          trap cleanup EXIT

          Xvfb "${DISPLAY}" -screen 0 1440x1000x24 >"${RUNNER_TEMP}/xvfb.log" 2>&1 &
          xvfb_pid=$!
          display_socket="/tmp/.X11-unix/X${DISPLAY#:}"
          for _ in $(seq 1 40); do
            [[ -S "${display_socket}" ]] && break
            kill -0 "${xvfb_pid}"
            sleep 0.25
          done
          [[ -S "${display_socket}" ]]

          google-chrome \
            --remote-debugging-port=19222 \
            --remote-debugging-address=127.0.0.1 \
            --remote-allow-origins=* \
            --user-data-dir="${profile}" \
            --password-store=basic \
            --no-first-run \
            --no-default-browser-check \
            --no-sandbox \
            --disable-dev-shm-usage \
            --window-size=1440,1000 \
            "https://we.51job.com/pc/search" \
            >"${RUNNER_TEMP}/chrome.log" 2>&1 &
          chrome_pid=$!

          python scripts/ci/job51_headed_delivery_recovery_gate.py \
            | tee "${RUNNER_TEMP}/job51-headed-delivery-recovery.stdout"

      - name: Upload redacted gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job51-headed-delivery-recovery-gate
          path: |
            ${{ runner.temp }}/job51-headed-delivery-recovery.json
            ${{ runner.temp }}/job51-headed-delivery-recovery.stdout
            ${{ runner.temp }}/chrome.log
            ${{ runner.temp }}/xvfb.log
          if-no-files-found: warn
          retention-days: 7
